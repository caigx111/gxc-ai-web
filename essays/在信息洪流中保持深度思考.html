    <style>
        .essay-post {
            max-width: 900px;
            margin: 0 auto;

        .essay-post-header {

            display: flex;
            justify-content: center;
            gap: 2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .essay-meta span {

            align-items: center;
            gap: 0.5rem;
        }
        
        .essay-content {

            margin: 2rem 0 1rem 0;
        }

        }
        
        .essay-content blockquote {
            border-left: 4px solid var(--accent-color);
            padding-left: 1.5rem;
            margin: 2rem 0;
            font-style: italic;
            color: var(--text-secondary);
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-color);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: var(--transition);
        }
        
        .back-link:hover {
            transform: translateX(-5px);
        }
    </style>
</head>
