<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2024：在不确定中寻找确定 - gxc.ai</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .essay-post {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px;
            background: #fff;
        }
        
        .essay-post-header {
            text-align: center;
            margin-bottom: 4rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--bg-secondary);
        }
        
        .essay-post-header h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        
        .essay-meta {
            display: flex;
            justify-content: center;
            gap: 2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .essay-meta span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .essay-content {
            font-size: 1.1rem;
            line-height: 1.9;
            color: var(--text-color);
        }
        
        .essay-content h2 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin: 3rem 0 1.5rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--bg-secondary);
        }
        
        .essay-content h3 {
            font-size: 1.4rem;
            color: var(--primary-color);
            margin: 2rem 0 1rem 0;
        }
        
        .essay-content p {
            margin-bottom: 1.5rem;
        }
        
        .essay-content blockquote {
            border-left: 4px solid var(--accent-color);
            padding-left: 1.5rem;
            margin: 2rem 0;
            font-style: italic;
            color: var(--text-secondary);
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-color);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: var(--transition);
        }
        
        .back-link:hover {
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <article class="essay-post">

            <i class="fas fa-arrow-left"></i>

                <span><i class="fas fa-tag"></i> 生活感悟</span>
            </div>
        </header>
        
        <div class="essay-content">
            <p>新的一年，技术变革加速，世界充满不确定性。但有些东西是确定的：持续学习的习惯、深度思考的能力、与人真诚连接的愿望。这些才是应对变化的根本。</p>

</body>
</html>
